:"digital",x:35,y:2,w:57,h:8,offX:60,offY:-170,stage:4,labelPos:"top",color:"#e8930c"},{id:"analog",name:"Analog Input Pins",short:"Analog pins read continuous voltage values — perfect for sensors like temperature and light.",howTo:["Connect the sensor output wire to one of the A0–A5 pins","Read the voltage with analogRead() to get a value from 0 to 1023","Map that number to the real-world unit (temperature, moisture) in your sketch"],what:'The six analog input pins (A0–A5) measure a continuous voltage between 0V and 5V and convert it into a number between 0 and 1023 (10-bit resolution). This lets Arduino read "how much" rather than just "on or off".',uses:["Reading temperature and light sensors","Measuring potentiometer positions and voltage levels","Reading analog environmental sensors (gas, moisture)","Battery level monitoring"],advantages:["Reads continuous values, not just on/off","10-bit resolution for reasonably fine measurements","Also usable as normal digital pins if needed"],disadvantages:["Only 6 analog pins on the Uno","5V reference limits measurable range without dividers","Sensitive to electrical noise without shielding"],examples:["A light sensor that dims an LED based on brightness","A soil moisture sensor controlling a plant watering pump"],icon:"Gauge",variant:"analog",x:39,y:89,w:31,h:9,offX:-80,offY:170,stage:4,labelPos:"bottom",color:"#0aa7c7"},{id:"pwm",name:"PWM Pins",short:"PWM pins create smooth variable output — dim lights and control motor speed.",howTo:["Choose a PWM-capable pin marked with ~ (3, 5, 6, 9, 10 or 11)","Send a brightness or speed value from 0 to 255 with analogWrite()","Add a transistor or motor driver for higher-power loads"],what:"Pulse Width Modulation (PWM) rapidly switches a digital pin on and off so fast that the average output looks like an analog value. The Uno has six PWM pins marked with a ~ symbol (3, 5, 6, 9, 10, 11).",uses:["Dimming LEDs with smooth brightness control","Controlling DC motor speed","Generating audio-like tones with passive buzzers","Simulating analog output voltages"],advantages:["Creates analog-like output from a digital pin","Simple to use with analogWrite","Very efficient for motor and LED control"],disadvantages:["Only 6 PWM pins available","Limited PWM frequency for some applications","Needs a driver circuit for higher-power loads"],examples:["A sunset lamp that slowly fades in and out","A fan whose speed is controlled by temperature"],icon:"Activity",variant:"pwm",x:91,y:30,w:9,h:30,offX:190,offY:60,stage:4,labelPos:"right",color:"#e63250"},{id:"usb",name:"USB Port",short:"The USB port powers the board and uploads your programs.",howTo:["Plug the USB cable into your computer","Select the board and port in the Arduino IDE, then click Upload","Open the Serial Monitor at the same baud rate as your sketch to chat with the board"],what:"The USB Type-B port on the Uno serves two jobs: it supplies 5V power to the board and carries data between your computer and the microcontroller while you upload sketches or send serial messages.",uses:["Uploading programs from the Arduino IDE","Providing 5V power to the board","Serial communication with the computer (Serial Monitor)","Interacting with desktop software in IoT prototypes"],advantages:["Plug-and-play with any computer","Combines power and data in one cable","Brings up serial debugging, vital for learning"],disadvantages:["Power limited to about 500mA from a computer","Requires a USB cable and drivers","Not suitable for high-current loads"],examples:["Uploading a blinking LED program to a new board","Streaming sensor data to your laptop via Serial Monitor"],icon:"Usb",variant:"usb",x:14,y:78,w:24,h:12,offX:-200,offY:130,stage:3,labelPos:"bottom",color:"#0aa7c7"},{id:"usbserial",name:"USB-to-Serial Interface",short:"This chip converts USB data into signals the microcontroller understands.",howTo:["Plug in USB and let the computer install the driver once","Upload sketches from the IDE — the bridge handles communication automatically","Open the Serial Monitor for two-way debugging at 9600 baud"],what:"The USB-to-serial converter (on the Uno it is the ATmega16U2) translates between the USB protocol used by your computer and the serial UART protocol used by the ATmega328P. It is what lets the Arduino IDE communicate with the board.",uses:["Bridging USB and serial data","Enabling program uploads","Enabling Serial Monitor debugging","Supporting more advanced reprogramming of the board"],advantages:["Makes the board work on modern computers without extra hardware","Reliable two-way communication"],disadvantages:["Adds a small cost to the board","Needs its own driver on some operating systems"],examples:["Seeing live temperature readings in the Serial Monitor","Uploading a new sketch after changing code in the IDE"],icon:"Radio",variant:"usbserial",x:14,y:65,w:12,h:6,offX:-200,offY:60,stage:3,labelPos:"left",color:"#0aa7c7"},{id:"dcpower",name:"DC Power Jack",short:"The barrel jack lets you power the board from a wall adapter.",howTo:["Plug a 7–12V adapter into the barrel jack (center pin positive)","Let the onboard regulator produce the 5V and 3.3V rails automatically","Stay below 12V to keep the regulator from overheating"],what:"The DC barrel jack accepts an external power supply of 7–12V, which is much more powerful than USB. The onboard regulator steps this voltage down to the 5V and 3.3V the board and its components need.",uses:["Powering the board from a wall adapter","Supplying power for projects with motors or relays","Running standalone (battery or adapter) IoT nodes"],advantages:["Supplies more current than USB","Accepts a wide voltage range (7–12V)","Essential for standalone projects away from a computer"],disadvantages:["Requires an extra adapter and cable","Above 12V can overheat the regulator","Polarity must be observed (center positive)"],examples:["A weather station running 24/7 from a wall adapter","A robot powered by a rechargeable battery pack"],icon:"Plug",va
