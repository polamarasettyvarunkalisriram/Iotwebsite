e ATmega328P is the 8-bit AVR chip that powers the classic Arduino Uno. It executes your program line by line, reads the state of its pins, and writes output signals to control electronics connected to the board.",uses:["Runs the sketch you upload from the Arduino IDE","Reads sensor values through its analog and digital pins","Controls LEDs, motors, relays and other outputs","Handles communication via I2C, SPI and UART"],advantages:["Simple 8-bit architecture that is easy to learn","28 pins with plenty of I/O capability","Pre-programmed with a bootloader, ready to upload","Extremely low cost and widely available","Huge amount of learning resources online"],disadvantages:["Only 16MHz clock speed and 2KB of RAM","32KB flash storage limits program complexity","8-bit processing is slow for heavy computation","Limited memory for complex IoT data handling"],examples:["A temperature logger that stores readings every minute","A home security alarm reading PIR sensors and sounding a buzzer"],icon:"Cpu",variant:"microcontroller",x:37,y:34,w:28,h:24,offX:-170,offY:170,stage:2,labelPos:"right",color:"#0aa7c7"},{id:"digital",name:"Digital I/O Pins",short:"Digital pins let Arduino talk to on/off electronics — from buttons to relays.",howTo:["Declare each pin as INPUT or OUTPUT with pinMode() inside setup()","Read buttons with digitalRead() or drive LEDs and relays with digitalWrite()","Respect the 5V and 40mA limits when connecting parts"],what:"Digital pins are the 0 to 13 pins on the Arduino Uno. They can be configured as inputs (to read HIGH/LOW states) or outputs (to drive a pin HIGH or LOW). Every digital pin uses just two states, exactly like binary 1 and 0.",uses:["Reading buttons, switches and digital sensors","Driving LEDs, buzzers and relays","Communicating with modules such as LCDs and ultrasonic sensors","Sending control signals to motor drivers"],advantages:["Easy to program with digitalWrite / digitalRead","Works with a huge variety of digital components","Fast switching for simple control tasks"],disadvantages:["Only a limited number of pins on the board","Limited to two states — no variable values without extra work","Voltage limits must be respected (5V, max 40mA per pin)"],examples:["Reading a push button to turn on an LED","Controlling a relay that switches a home appliance"],icon:"Binary",variant:"digital",x:35,y:2,w:57,h:8,offX:60,offY:-170,stage:4,labelPos:"top",color:"#e8930c"},{id:"analog",name:"Analog Input Pins",short:"Analog pins read continuous voltage values — perfect for sensors like temperature and light.",howTo:["Connect the sensor output wire to one of the A0–A5 pins","Read the voltage with analogRead() to get a value from 0 to 1023","Map that number to the real-world unit (temperature, moisture) in your sketch"],what:'The six analog input pins (A0–A5) measure a continuous voltage between 0V and 5V and convert it into a number between 0 and 1023 (10-bit resolution). This lets Arduino read "how much" rather than just "on or off".',uses:["Reading temperature and light sensors","Measuring potentiometer positions and voltage levels","Reading analog environmental sensors (gas, moisture)","Battery level monitoring"],advantages:["Reads continuous values, not just on/off","10-bit resolution for reasonably fine measurements","Also usable as normal digital pins if needed"],disadvantages:["Only 6 analog pins on the Uno","5V reference limits measurable range without dividers","Sensitive to electrical noise without shielding"],examples:["A light sensor that dims an LED based on brightness","A soil moisture sensor controlling a plant watering pump"],icon:"Gauge",variant:"analog",x:39,y:89,w:31,h:9,offX:-80,offY:170,stage:4,labelPos:"bottom",color:"#0aa7c7"},{id:"pwm",name:"PWM Pins",short:"PWM pins create smooth variable output — dim lights and control motor speed.",howTo:["Choose a PWM-capable pin marked with ~ (3, 5, 6, 9, 10 or 11)","Send a brightness or speed value from 0 to 255 with analogWrite()","Add a transistor o
